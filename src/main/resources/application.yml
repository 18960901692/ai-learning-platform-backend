server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_learning_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 18765105
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-35290a1661da41b1ac5e6c2ae296cc39}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}
          temperature: 0.7

# 文件上传配置
file:
  upload:
    path: ./uploads/

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.aicompanion.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  # 密钥（至少 32 字节，即 256 位）
  secret: aic0mpani0n2024SecretKeyForJWTToken!!
  # 访问 Token 有效期（毫秒）：24 小时
  expiration: 86400000
  # 刷新 Token 有效期（毫秒）：7 天（用于记住密码）
  refresh-expiration: 604800000

# Swagger/OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
